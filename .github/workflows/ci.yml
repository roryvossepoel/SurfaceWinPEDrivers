name: CI

on:
  push:
    branches:
      - feature/initial-module
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Import in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Test-ModuleManifest .\SurfaceWinPEDrivers.psd1 | Out-Null
          Import-Module .\SurfaceWinPEDrivers.psd1 -Force
          Get-Command -Module SurfaceWinPEDrivers | Format-Table -AutoSize

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -MinimumVersion 5.6.1 -MaximumVersion 6.99.99 -Scope CurrentUser -Force -SkipPublisherCheck
          $result = Invoke-Pester -Path .\Tests -PassThru
          if ($result.FailedCount -gt 0 -or $result.FailedContainersCount -gt 0) {
              throw "Pester failed: $($result.FailedCount) failed tests, $($result.FailedContainersCount) failed containers."
          }

      - name: Validate Gallery package staging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = .\build.ps1
          $build | Format-List
          Test-ModuleManifest .\out\SurfaceWinPEDrivers\SurfaceWinPEDrivers.psd1 | Out-Null
          Import-Module .\out\SurfaceWinPEDrivers\SurfaceWinPEDrivers.psd1 -Force

  live-microsoft-smoke-test:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and validate live manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\SurfaceWinPEDrivers.psd1 -Force
          $manifestPath = Join-Path $env:RUNNER_TEMP 'SurfaceWinPE.Manifest.json'

          try {
              $manifest = New-SurfaceWinPEManifest -All -Path $manifestPath -Validate -Verbose
          }
          catch {
              if (Test-Path -LiteralPath $manifestPath) {
                  $failedManifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
                  Write-Host "Discovery summary:"
                  $failedManifest.Discovery | Format-List
                  Write-Host "Failed models:"
                  foreach ($model in @($failedManifest.Models | Where-Object { $_.Validation.Status -eq 'Failed' })) {
                      Write-Host "FAILED: $($model.Model)"
                      foreach ($message in @($model.Validation.Errors)) {
                          Write-Host "  - $message"
                      }
                  }
              }
              throw
          }

          $manifest.Discovery | Format-List
          $manifest.Models |
            Select-Object Model, Architecture, DiscoveryStatus,
              @{n='FolderSource';e={$_.WinPE.ImportFolderSource}},
              @{n='ImportFolders';e={$_.WinPE.ImportFolders.Count}},
              @{n='RequiredPackages';e={$_.WinPE.RequiredPackages.Count}},
              @{n='DriverPack';e={$_.DriverPack.DriverPackFileName}},
              @{n='DriverPackOS';e={"$($_.DriverPack.OsName) $($_.DriverPack.OsBuildNumber)"}},
              @{n='Validation';e={$_.Validation.Status}} |
            Format-Table -AutoSize

      - name: Upload live manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SurfaceWinPE-Manifest
          path: ${{ runner.temp }}/SurfaceWinPE.Manifest.json
          if-no-files-found: warn
