name: CI

on:
  push:
    branches:
      - feature/initial-module
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Test-ModuleManifest .\SurfaceWinPEDrivers.psd1 | Out-Null
          Import-Module .\SurfaceWinPEDrivers.psd1 -Force
          Get-Command -Module SurfaceWinPEDrivers | Format-Table -AutoSize

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -MinimumVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck
          $result = Invoke-Pester -Path .\Tests -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester test(s) failed." }

  live-microsoft-smoke-test:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate live manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\SurfaceWinPEDrivers.psd1 -Force
          $manifestPath = Join-Path $env:RUNNER_TEMP 'SurfaceWinPE.Manifest.json'
          $manifest = New-SurfaceWinPEManifest -All -Path $manifestPath -Validate -Verbose
          $manifest.Discovery | Format-List
          $manifest.Models |
            Select-Object Model, Architecture, DiscoveryStatus,
              @{n='ImportFolders';e={$_.WinPE.ImportFolders.Count}},
              @{n='RequiredPackages';e={$_.WinPE.RequiredPackages.Count}},
              @{n='DriverPack';e={$_.DriverPack.DriverPackFileName}},
              @{n='Validation';e={$_.Validation.Status}} |
            Format-Table -AutoSize

      - name: Upload validated manifest
        uses: actions/upload-artifact@v4
        with:
          name: SurfaceWinPE-Manifest
          path: ${{ runner.temp }}/SurfaceWinPE.Manifest.json
